services:
  source:
    image: mysql:8.4
    container_name: source
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
      MYSQL_ROOT_HOST: "%"
#    command:
#      - --character-set-server=utf8mb4
#      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./source/conf.d:/etc/mysql/conf.d  # 로컬 ./conf.d 안의 모든 *.cnf를 컨테이너 /etc/mysql/conf.d 로
      - ./source/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
  replica:
    image: mysql:8.4
    container_name: replica
    ports: ["3308:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
#    command:
    depends_on: [source]
    volumes:
      - ./replica1/conf.d:/etc/mysql/conf.d
#      - ./replica1/01-replication.sql:/docker-entrypoint-initdb.d/01-replication.sql # 파일복사
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks: [replnet]

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "root:root@(source:3306)/"
    depends_on:
      source:
        condition: service_healthy
    networks: [replnet]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9104/metrics" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      mysqld-exporter:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/ready" ]
      interval: 30s
      retries: 3
      start_period: 15s
      timeout: 5s
    networks: [replnet]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [replnet]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 5s

networks:
  replnet: {}


#  docker compose down -v   # 컨테이너와 볼륨 모두 삭제 (데이터 날아감)
#  docker compose up -d     # 다시 올리면 환경변수 적용된 상태로 DB 초기화