services:
  source:
    image: mysql:8.4
    container_name: source
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
      MYSQL_ROOT_HOST: "%"
#    command:
#      - --character-set-server=utf8mb4
#      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./source/conf.d:/etc/mysql/conf.d  # 로컬 ./conf.d 안의 모든 *.cnf를 컨테이너 /etc/mysql/conf.d 로
      - ./source/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uexporter -pexporterpwd -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks: [replnet]
  replica:
    image: mysql:8.4
    container_name: replica
    ports: ["3308:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
#    command:
    depends_on:
      source:
        condition: service_healthy
    volumes:
      - ./replica1/conf.d:/etc/mysql/conf.d
      - ./replica1/init:/docker-entrypoint-initdb.d # 파일복사
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uexporter -pexporterpwd -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks: [replnet]

  mysqld-exporter-source:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter-source
    restart: unless-stopped
    ports: [ "9104:9104" ]
    command:
      # ★ 명시적으로 .my.cnf 경로와 대상 DB 주소를 지정 (버전 차이/DSN 함정 회피)
      - --config.my-cnf=/cfg/.my.cnf
      - --mysqld.address=source:3306
      - --collect.info_schema.innodb_metrics
      - --collect.engine_innodb_status              # InnoDB 상태 파싱(락/데드락 통계 보강)
      - --collect.info_schema.processlist   # 활성 스레드/상태 카운팅용
    volumes:
      - ./exporter/source.my.cnf:/cfg/.my.cnf        # [client] user/password 제공
    depends_on:
      source:
        condition: service_healthy
    networks: [ replnet ]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9104/metrics" ]
      interval: 30s
      retries: 3
      start_period: 10s

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter-replica
    restart: unless-stopped
    ports: ["9105:9104"]   # 호스트 포트 겹침 방지
    command:
      - --config.my-cnf=/cfg/.my.cnf
      - --mysqld.address=replica:3306
      - --collect.info_schema.innodb_metrics        # row lock waits/time 등
      - --collect.engine_innodb_status              # InnoDB 상태 파싱(락/데드락 통계 보강)
      - --collect.info_schema.processlist   # 활성 스레드/상태 카운팅용
    environment: {}
    volumes:
      - ./exporter/replica.my.cnf:/cfg/.my.cnf:ro
    depends_on:
      replica:
        condition: service_healthy
    networks: [ replnet ]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9104/metrics" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      mysqld-exporter-source:
        condition: service_healthy
      mysqld-exporter-replica:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/ready" ]
      interval: 30s
      retries: 3
      start_period: 15s
      timeout: 5s
    networks: [replnet]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [replnet]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 5s

networks:
  replnet: {}


#  docker compose down -v   # 컨테이너와 볼륨 모두 삭제 (데이터 날아감)
#  docker compose up -d     # 다시 올리면 환경변수 적용된 상태로 DB 초기화


# Exporter: MySQL 상태를 “Prometheus가 이해할 수 있는 지표 포맷”으로 변환.
# Prometheus: 주기적으로 scrape → 내부 DB에 시계열 저장.
# Grafana: Prometheus DB에 쿼리 → 시각화.