global:
  scrape_interval: 5s     # 기본 스크레이프 주기
  scrape_timeout: 4s      # 타임아웃 (주기보다 짧게)

scrape_configs:
  # Prometheus 자기 자신 모니터링 (디버깅용)
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # MySQL Exporter (source + replica)
  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter-source:9104"]
        labels:
          instance: "source"     # Grafana에서 구분하기 좋게 라벨 부여
      - targets: ["mysqld-exporter-replica:9104"]
        labels:
          instance: "replica"