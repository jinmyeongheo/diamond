spring:
  datasource:
    hikari:
      max-lifetime: 58000 #DB wait_timeout=60
      idle-timeout: 58000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties: # Difference between spring.jpa.properties.hibernate and spring.jpa.hibernate
      hibernate:
        ddl-auto: create
#        show-sql: true
#        format_sql: true
#        use_sql_comments: true
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

logging:
  level:
    org:
      hibernate:
        sql : debug
        type : trace
