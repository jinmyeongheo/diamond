spring:
  datasource:
    url: jdbc:mariadb://192.168.20.106:3306/modnpay?useUnicode=true&characterEncoding=utf8&autoReconnect=true
    username: modnpay
    password: modnpay_pwd!
    hikari:
      max-lifetime: 58000 #DB wait_timeout=60
      idle-timeout: 58000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: true
    database-platform: org.hibernate.dialect.MariaDB103Dialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties: # Difference between spring.jpa.properties.hibernate and spring.jpa.hibernate
      hibernate:
        ddl-auto: none
        show-sql: true
        format_sql: true
        use_sql_comments: true
logging:
  level:
    org:
      hibernate:
        sql : debug
        type : trace
