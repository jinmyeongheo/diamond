# 로컬 개발환경 설정
# 1. 인메모리 db 빌드, 2. table create ,3. 테스트 데이터 insert, 4. 필요에 따라 flush, clear 실행.
server:
  port: 8888

spring:
  datasource:
    url: jdbc:h2:mem:local;MODE=MySQL;DATABASE_TO_LOWER=TRUE # in-memory, mysql
    username: sa # 기본계정은 비밀번호 없음.
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: true
    database-platform: org.hibernate.dialect.MySQL5Dialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties: # Difference between spring.jpa.properties.hibernate and spring.jpa.hibernate
      hibernate:
        ddl-auto: create
        show-sql: true
        format_sql: true
        use_sql_comments: true
