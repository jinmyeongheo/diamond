# 로컬 개발환경 설정
# 1. 인메모리 db 빌드, 2. table create ,3. 테스트 데이터 insert, 4. 필요에 따라 flush, clear 실행.
server:
  port: 8888

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5     # max보다 작게
      max-lifetime: 180000
      idle-timeout: 60000  # 1분 (원하면 유지)
  batch:
    job:
      enabled: false
  quartz:
    properties:
      org:
        quartz:
          scheduler:
            instanceName: modnpay-batch-scheduler2
            instanceId: AUTO
            makeSchedulerThreadDaemon: true
            interruptJobsOnShutdown: true
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            useProperties: false
            clusterCheckinInterval: 20000
            misfireThreshold: 60000
            tablePrefix: QRTZ_
            isClustered: true
        threadpool:
          makethreadsdaemons: true
          threadCount: 5
#  h2:
#    console:
#      enabled: false
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQL5Dialect
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties: # Difference between spring.jpa.properties.hibernate and spring.jpa.hibernate
      hibernate:
        ddl-auto: none


# 로그 레벨: 쿼리 로그는 DEBUG, 슬로우쿼리는 WARN 으로 떨어집니다.
logging:
  level:
    net.ttddyy.dsproxy.listener.logging.SLF4JQueryLoggingListener: DEBUG
    net.ttddyy.dsproxy.listener.logging.SLF4JSlowQueryListener: WARN

# datasource-proxy 옵션 (스타터가 노출하는 설정)
decorator:
  datasource:
    datasource-proxy:
      multiline: true                  # 여러 줄 포맷
      format-sql: true                 # SQL 포매팅(하이버네이트 포매터 감지)
      json-format: false               # JSON 포맷(원하면 true)
      slow-query:
        enable-logging: true
        log-level: warn
        threshold: 300                 # ms 단위 (예: 300ms 이상 슬로우)
