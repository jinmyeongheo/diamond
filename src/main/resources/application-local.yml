# 로컬 개발환경 설정
# 1. 인메모리 db 빌드, 2. table create ,3. 테스트 데이터 insert, 4. 필요에 따라 flush, clear 실행.
server:
  port: 8888

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mall
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
#  h2:
#    console:
#      enabled: false
  jpa:
    open-in-view: true
    database-platform: org.hibernate.dialect.MySQL5Dialect
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties: # Difference between spring.jpa.properties.hibernate and spring.jpa.hibernate
      hibernate:
        ddl-auto: none
        show-sql: true
        format_sql: true
        use_sql_comments: true
logging:
  level:
    org.hibernate.SQL: DEBUG                    # SQL 문
    org.hibernate.type.descriptor.sql: TRACE    # 바인딩  파라미터
    # 필요 시 줄이기
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.hibernate.engine.transaction: DEBUG
    org.hibernate.engine.jdbc.connections: DEBUG
